# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: idf-mission-helper
    runtime: node
    plan: free            # sleeps after ~15 min idle (in-memory rosters are cleared). "starter" = always on.
    region: frankfurt     # closest Render region to Israel
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true      # every push to main redeploys
    envVars:
      - key: NODE_ENV
        value: production # Secure cookies + trust the load balancer's client IP
      - key: NODE_VERSION
        value: "22"
      - key: MAX_SESSIONS
        value: "40"
      # WhatsApp sending — secrets are entered in the Render dashboard (never in the repo).
      # Any missing one disables sending; the rest of the site works as before.
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_WABA_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_TEST_PHONE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PHONE_ENC_KEY
        sync: false
      - key: SEND_CODE
        sync: false
      - key: WA_TEMPLATE_PREFIX
        value: duty_roster_days_
      - key: WA_TEMPLATE_LANG
        value: he
